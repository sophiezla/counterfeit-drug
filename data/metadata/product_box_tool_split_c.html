<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Product box annotation &mdash; Split C</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0;
         background: #1e1e1e; color: #eee; overflow: hidden; }
  #bar { display: flex; justify-content: space-between; align-items: center;
         padding: 8px 16px; background: #111; font-size: 14px; }
  #bar b { color: #6fb2ff; }
  #wrap { display: flex; align-items: center; justify-content: center;
          height: calc(100vh - 84px); }
  #stage { position: relative; line-height: 0; cursor: crosshair; }
  #img { max-height: calc(100vh - 100px); max-width: 96vw; user-select: none;
         -webkit-user-drag: none; }
  #box { position: absolute; border: 2px solid #6fb2ff;
         background: rgba(111,178,255,0.16); display: none;
         pointer-events: none; }
  #prog { height: 4px; background: #333; }
  #fill { height: 4px; background: #6fb2ff; width: 0; }
  #hint { padding: 4px 16px; background: #111; font-size: 12px; color: #999; }
  #err { color: #ff9a76; font-size: 15px; padding: 20px; display: none; }
  #done-banner { display: none; padding: 8px 16px; background: #14532d;
                 color: #d7ffe6; font-size: 14px; text-align: center; }
  button { background: #2a78d6; color: #fff; border: 0; padding: 6px 12px;
           border-radius: 4px; cursor: pointer; font-size: 13px; }
</style>
</head>
<body>
<div id="bar">
  <div><b id="n">0</b> / <span id="total">0</span> &nbsp; boxed:
       <b id="done">0</b> &nbsp; skipped: <b id="skipped">0</b></div>
  <div id="name"></div>
  <div><button onclick="exportCsv()">Export CSV</button></div>
</div>
<div id="prog"><div id="fill"></div></div>
<div id="wrap"><div id="stage"><img id="img" draggable="false"><div id="box">

<div id="done-banner"></div>
<div id="hint">drag a box round the product &mdash; releasing saves and advances

).jpg"}, {"id": "mendeley_split_c_00113", "path": "../raw/mendeley_split_c/huawei_cn_(65).jpg"}, {"id": "mendeley_split_c_00114", "path": "../raw/mendeley_split_c/huawei_cn_(66).jpg"}, {"id": "mendeley_split_c_00115", "path": "../raw/mendeley_split_c/huawei_cn_(67).jpg"}, {"id": "mendeley_split_c_00116", "path": "../raw/mendeley_split_c/huawei_cn_(68).jpg"}, {"id": "mendeley_split_c_00117", "path": "../raw/mendeley_split_c/huawei_cn_(69).jpg"}, {"id": "mendeley_split_c_00118", "path": "../raw/mendeley_split_c/huawei_cn_(7).jpg"}, {"id": "mendeley_split_c_00119", "path": "../raw/mendeley_split_c/huawei_cn_(70).jpg"}, {"id": "mendeley_split_c_00120", "path": "../raw/mendeley_split_c/huawei_cn_(71).jpg"}, {"id": "mendeley_split_c_00121", "path": "../raw/mendeley_split_c/huawei_cn_(72).jpg"}, {"id": "mendeley_split_c_00122", "path": "../raw/mendeley_split_c/huawei_cn_(73).jpg"}, {"id": "mendeley_split_c_00123", "path": "../raw/mendeley_split_c/huawei_cn_(74).jpg"}, {"id": "mendeley_split_c_00124", "path": "../raw/mendeley_split_c/huawei_cn_(75).jpg"}, {"id": "mendeley_split_c_00125", "path": "../raw/mendeley_split_c/huawei_cn_(76).jpg"}, {"id": "mendeley_split_c_00126", "path": "../raw/mendeley_split_c/huawei_cn_(77).jpg"}, {"id": "mendeley_split_c_00127", "path": "../raw/mendeley_split_c/huawei_cn_(78).jpg"}, {"id": "mendeley_split_c_00128", "path": "../raw/mendeley_split_c/huawei_cn_(79).jpg"}, {"id": "mendeley_split_c_00129", "path": "../raw/mendeley_split_c/huawei_cn_(8).jpg"}, {"id": "mendeley_split_c_00130", "path": "../raw/mendeley_split_c/huawei_cn_(80).jpg"}, {"id": "mendeley_split_c_00131", "path": "../raw/mendeley_split_c/huawei_cn_(81).jpg"}, {"id": "mendeley_split_c_00132", "path": "../raw/mendeley_split_c/huawei_cn_(82).jpg"}, {"id": "mendeley_split_c_00133", "path": "../raw/mendeley_split_c/huawei_cn_(83).jpg"}, {"id": "mendeley_split_c_00134", "path": "../raw/mendeley_split_c/huawei_cn_(84).jpg"}, {"id": "mendeley_split_c_00135", "path": "../raw/mendeley_split_c/huawei_cn_(85).jpg"}, {"id": "mendeley_split_c_00136", "path": "../raw/mendeley_split_c/huawei_cn_(86).jpg"}, {"id": "mendeley_split_c_00137", "path": "../raw/mendeley_split_c/huawei_cn_(87).jpg"}, {"id": "mendeley_split_c_00138", "path": "../raw/mendeley_split_c/huawei_cn_(88).jpg"}, {"id": "mendeley_split_c_00139", "path": "../raw/mendeley_split_c/huawei_cn_(89).jpg"}, {"id": "mendeley_split_c_00140", "path": "../raw/mendeley_split_c/huawei_cn_(9).jpg"}, {"id": "mendeley_split_c_00141", "path": "../raw/mendeley_split_c/huawei_cn_(90).jpg"}, {"id": "mendeley_split_c_00142", "path": "../raw/mendeley_split_c/huawei_cn_(91).jpg"}, {"id": "mendeley_split_c_00143", "path": "../raw/mendeley_split_c/huawei_cn_(92).jpg"}, {"id": "mendeley_split_c_00144", "path": "../raw/mendeley_split_c/huawei_cn_(93).jpg"}, {"id": "mendeley_split_c_00145", "path": "../raw/mendeley_split_c/huawei_cn_(94).jpg"}, {"id": "mendeley_split_c_00146", "path": "../raw/mendeley_split_c/huawei_cn_(95).jpg"}, {"id": "mendeley_split_c_00147", "path": "../raw/mendeley_split_c/huawei_cn_(96).jpg"}, {"id": "mendeley_split_c_00148", "path": "../raw/mendeley_split_c/huawei_cn_(97).jpg"}, {"id": "mendeley_split_c_00149", "path": "../raw/mendeley_split_c/huawei_cn_(99).jpg"}];
const KEY = "product_boxes_" + location.pathname;
let i = 0, boxes = JSON.parse(localStorage.getItem(KEY) || "{}");

const img = document.getElementById("img"), box = document.getElementById("box");
const stage = document.getElementById("stage");

function show() {
  i = Math.max(0, Math.min(ITEMS.length - 1, i));
  const it = ITEMS[i];
  img.src = it.path;
  document.getElementById("n").textContent = i + 1;
  document.getElementById("total").textContent = ITEMS.length;
  document.getElementById("name").textContent = it.id;
  const vals = Object.values(boxes);
  document.getElementById("done").textContent =
      vals.filter(v => v.status === "box").length;
  document.getElementById("skipped").textContent =
      vals.filter(v => v.status === "skip").length;
  document.getElementById("fill").style.width =
      (100 * vals.length / ITEMS.length) + "%";
  const banner = document.getElementById("done-banner");
  if (vals.length >= ITEMS.length) {
    banner.textContent = "all " + ITEMS.length + " images recorded — "
        + "click Export CSV, and save it as product_boxes_split_c.csv";
    banner.style.display = "block";
  } else { banner.style.display = "none"; }
  draw(boxes[it.id]);
}

function draw(rec) {
  if (!rec || rec.status !== "box") { box.style.display = "none"; return; }
  const w = img.clientWidth, h = img.clientHeight;
  box.style.left = (rec.x0 * w) + "px";
  box.style.top = (rec.y0 * h) + "px";
  box.style.width = ((rec.x1 - rec.x0) * w) + "px";
  box.style.height = ((rec.y1 - rec.y0) * h) + "px";
  box.style.display = "block";
}

function save(rec) {
  boxes[ITEMS[i].id] = rec;
  localStorage.setItem(KEY, JSON.stringify(boxes));
}

let dragging = false, sx = 0, sy = 0;
stage.addEventListener("mousedown", e => {
  dragging = true;
  [sx, sy] = at(e);
  box.style.left = sx + "px"; box.style.top = sy + "px";
  box.style.width = "0px"; box.style.height = "0px";
  box.style.display = "block";
  e.preventDefault();
});
function at(e) {
  // Clamp to the image: a drag may legitimately end past its edge, and the
  // box should stop at the frame rather than record a negative coordinate.
  const r = img.getBoundingClientRect();
  return [Math.max(0, Math.min(img.clientWidth, e.clientX - r.left)),
          Math.max(0, Math.min(img.clientHeight, e.clientY - r.top))];
}
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const [x, y] = at(e);
  box.style.left = Math.min(sx, x) + "px";
  box.style.top = Math.min(sy, y) + "px";
  box.style.width = Math.abs(x - sx) + "px";
  box.style.height = Math.abs(y - sy) + "px";
});
window.addEventListener("mouseup", e => {
  if (!dragging) return;
  dragging = false;
  const [x, y] = at(e);
  const w = img.clientWidth, h = img.clientHeight;
  // A hidden or unloaded image has zero size, and dividing by it would
  // record NaN coordinates that look like a real annotation.
  if (!w || !h) { box.style.display = "none"; return; }
  const x0 = Math.max(0, Math.min(sx, x) / w), x1 = Math.min(1, Math.max(sx, x) / w);
  const y0 = Math.max(0, Math.min(sy, y) / h), y1 = Math.min(1, Math.max(sy, y) / h);
  // A stray click is not a box. Anything under 2% of the frame is ignored, so
  // a mis-click does not silently record a degenerate annotation.
  if ((x1 - x0) * (y1 - y0) < 0.02) { draw(boxes[ITEMS[i].id]); return; }
  save({status: "box", x0: +x0.toFixed(4), y0: +y0.toFixed(4),
         x1: +x1.toFixed(4), y1: +y1.toFixed(4)});
  i++; show();
});

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft") { i--; show(); }
  else if (k === "arrowright" || e.key === "Enter") { i++; show(); }
  else if (k === "w") {
    save({status: "box", x0: 0, y0: 0, x1: 1, y1: 1}); i++; show();
  }
  else if (k === "s") { save({status: "skip"}); i++; show(); }
  else if (k === "r") { delete boxes[ITEMS[i].id];
                        localStorage.setItem(KEY, JSON.stringify(boxes));
                        show(); }
  else return;
  e.preventDefault();
});

function exportCsv() {
  const lines = ["image_id,status,x0,y0,x1,y1"];
  for (const it of ITEMS) {
    const r = boxes[it.id];
    if (!r) continue;
    lines.push(r.status === "box"
      ? [it.id, "box", r.x0, r.y0, r.x1, r.y1].join(",")
      : [it.id, "skip", "", "", "", ""].join(","));
  }
  const blob = new Blob([lines.join("\n") + "\n"], {type: "text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "product_boxes_split_c.csv";
  a.click();
}

img.addEventListener("load", () => {
  document.getElementById("err").style.display = "none";
  img.style.display = "";
  draw(boxes[ITEMS[i].id]);
});
img.addEventListener("error", () => {
  img.style.display = "none";
  const el = document.getElementById("err");
  el.textContent = "cannot load " + ITEMS[i].path + " — open this file "
      + "from inside data/metadata/ so the relative path resolves";
  el.style.display = "block";
});
show();
</script>
</body>
</html>
